name: Generate blog drafts

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC = 3AM EST / 4AM EDT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print posts instead of writing them"
        type: boolean
        default: true

permissions:
  id-token: write # request the OIDC token used to assume the AWS role
  contents: read

concurrency:
  group: generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - name: AWS credentials (OIDC, main branch only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::336757184020:role/blog-notes-GeneratorRole-wBWwX12lopMQ
          aws-region: us-east-1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m blog_generator.main --dry-run
          else
            python -m blog_generator.main
          fi
